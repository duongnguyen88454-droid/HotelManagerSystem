# Cau hinh "dong bang" vi pham cu cua ArchUnit (xem ArchitectureRulesTest).
# Ten thuoc tinh theo tai lieu ArchUnit (FreezingArchRule); hay kiem tra lai khi chay lan dau.
freeze.store.default.path=src/test/resources/archunit_store
# Lan chay DAU TIEN: de true de tao store, roi COMMIT thu muc archunit_store.
# Sau do DOI THANH false de store khong bi tu tao lai am tham (QT 5.3).
freeze.store.default.allowStoreCreation=false
# Khong bao gio chap nhan "dong bang lai" toan bo vi pham moi.
freeze.refreeze=false
